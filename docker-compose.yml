services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amocars-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - amocars_vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - amocars

  mysql:
    image: mysql:8.4
    container_name: amocars-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: amocars
      MYSQL_USER: amocars
      MYSQL_PASSWORD: amocars_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - amocars_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - amocars

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: amocars-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - amocars

networks:
  amocars:

volumes:
  amocars_mysql_data:
  amocars_vendor: